<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#f2e9e0" />
<meta name="robots" content="noindex" />
<title>Paketstadt · Beispiel-Shop</title>
  <script src="./ep-mock.js"></script>
<link rel="stylesheet" href="./ep-hinweis.css">
<link rel="stylesheet" href="../shared/ex-paket-nav.css">
<link rel="stylesheet" href="./ex-social-ps.css">
  <script type="module" crossorigin src="./assets/index-3aR-DhqV.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B8FX1vDO.css">
<style id="ex-social-css">
#exSocialTab{font:600 13px/1 system-ui,-apple-system,sans-serif;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.55);color:#3a2a1c;cursor:pointer}
#exSocialTab[aria-selected="true"],#exSocialTab:hover{background:#fff;color:#0071e3;box-shadow:0 2px 10px rgba(0,113,227,.12)}
#exSocialFab{position:fixed;z-index:45;display:flex;flex-direction:column;gap:8px}
#exSocialFab button{font:700 12px/1.2 system-ui,sans-serif;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.7);background:rgba(255,248,240,.9);color:#3a2a1c;backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(40,24,10,.12);cursor:pointer;text-align:left}
#exSocialFab button small{display:block;font-weight:600;opacity:.7;margin-top:3px}
#exSocialPanel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;display:none;background:rgba(30,22,14,.28);backdrop-filter:blur(2px)}
#exSocialPanel.open{display:flex}
#exSocialPanel .sheet{width:min(920px,100%);height:100%;overflow:auto;background:linear-gradient(180deg,#fff8f1,#f3e7da);padding:16px 16px 88px;color:#2b2118;-webkit-overflow-scrolling:touch}
@media(max-width:440px){.switch button[data-view=bots]{display:inline-flex!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header class="top">
  <div class="brand"><span class="logo"></span><div><b>Paketstadt</b><small id="sub">Live-Lagerstadt</small></div></div>
  <nav class="switch" role="tablist">
    <span class="thumb"></span>
    <button data-view="stadt" role="tab">Stadt</button>
    <button data-view="lager" role="tab">Lager</button>
    <button data-view="dashboard" role="tab">Dashboard</button>
    <button data-view="personal" role="tab">Personal</button>
    <button data-view="bots" role="tab">Bots</button>
    <button type="button" id="exSocialTab" data-ex-social role="tab" aria-controls="exSocialPanel" aria-selected="false">Social</button>
  </nav>
  <button class="hint-tg" id="hintTg" type="button" aria-label="Hinweise und Demo-Aktionen" aria-expanded="false" aria-controls="hint"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M18 15.5l.8 1.7 1.7.8-1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8z" fill="currentColor"/></svg></button>
  <div class="right"><span class="live" aria-label="Live"><i></i><span>LIVE</span></span><span class="chip">BEISPIELDATEN</span></div>
</header>
<button class="back-btn" id="backBtn" type="button" hidden>← Zurück ins Lager</button>
<section class="kpis" id="kpis"></section>
<div class="ticker" id="ticker"></div>
<aside class="card" id="card" hidden></aside>
<div class="hint" id="hint"><span>Gebäude anklicken · Ziehen · Zoomen</span><button data-demo="order" type="button">Test-Bestellung</button><button data-demo="return" type="button">Test-Retoure</button></div>
<div class="ep-bsp" role="note">Beispieldaten – so könnte dein System aussehen</div>

<div id="exSocialFab" aria-label="Social Media in der Paketstadt">
  <button type="button" id="exSocialOpen"><b>Social Media</b><small>Kanäle &amp; Ads · Beispieldaten</small></button>
</div>
<div id="exSocialPanel" aria-hidden="true" role="dialog" aria-label="Social Media Bereich">
  <div class="sheet" id="exSocialSheet"></div>
</div>
<script src="../../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../shared/ep-shared-demo.js"></script>
<script src="../shared/ex-paket-nav.js"></script>
<script src="./ex-social.js"></script>

</body>
</html>
