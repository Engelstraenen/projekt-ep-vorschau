<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%225%22 y=%228%22 width=%2222%22 height=%2218%22 rx=%223%22 fill=%22%23c9965a%22/%3E%3Cpath d=%22M5 13h22%22 stroke=%22%238a6236%22 stroke-width=%222%22/%3E%3C/svg%3E" />
    <title>Paketstadt · Live-Dashboard (Prototyp, Beispieldaten)</title>
    <link rel="preload" as="image" href="./assets/plate-day.jpg" />
    <script src="./ep-mock.js"></script>
<script type="module" crossorigin src="./assets/index-o0t8XLOn.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CmRilGua.css">
  <link rel="stylesheet" href="./ep-hinweis.css">
</head>
  <body>
    <div id="app">
      <div class="viewport" id="viewport" aria-label="Paketstadt – Miniaturstadt mit Live-Bestellungen">
        <div class="stage" id="stage">
          <div class="layer layer-main" id="layer-main">
            <img class="plate day" src="./assets/plate-day.jpg" alt="" draggable="false" />
            <img class="plate night" src="./assets/plate-night.jpg" alt="" draggable="false" />
          </div>
          <div class="layer layer-far" id="layer-far">
            <img class="far day" src="./assets/far-day.webp" alt="" draggable="false" />
            <img class="far night" src="./assets/far-night.webp" alt="" draggable="false" />
          </div>
          <div class="layer layer-actors" id="actors"></div>
          <div class="layer layer-hotspots" id="hotspots"></div>
        </div>
        <div class="tilt tilt-top" aria-hidden="true"></div>
        <div class="tilt tilt-bottom" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <canvas class="fireworks" id="fireworks" aria-hidden="true"></canvas>
      </div>
      <div class="hud" id="hud"></div>
    </div>
  <div class="ep-bsp" role="note">Beispieldaten – so könnte dein System aussehen</div>
</body>
</html>
