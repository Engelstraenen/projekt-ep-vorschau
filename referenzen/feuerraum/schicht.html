<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FEUERRAUM</title>
<meta name="theme-color" content="#efebe5">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/style.css?v=1">
<style>
.u-kopf{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:var(--kopf);padding:0 var(--rand);background:rgba(var(--bg-rgb),.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.u-kopf .zurueck{margin-left:auto;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:8px;min-height:44px;color:var(--or);font-weight:500}
.u-held{position:relative;height:min(78vh,760px);overflow:hidden;background:var(--bg2)}
.u-held img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.u-held::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(var(--bg-rgb),1) 0,rgba(var(--bg-rgb),.75) 26%,rgba(var(--bg-rgb),0) 55%)}
.u-held .u-titel{position:absolute;left:var(--rand);right:var(--rand);bottom:34px;z-index:2}
.u-held.ohne{height:auto;padding:70px 0 10px}.u-held.ohne::after{display:none}.u-held.ohne .u-titel{position:static;padding:0 var(--rand)}
.u-lead{font-size:clamp(17px,1.5vw,21px);max-width:60ch;color:var(--ink2);margin:14px 0 0}
.u-fakten{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;padding:40px var(--rand)}
.u-fakten div{border-top:2px solid var(--or);padding-top:14px}
.u-fakten b{display:block;font-family:var(--serif);font-weight:400;color:var(--or);font-size:clamp(30px,3vw,44px);line-height:1.1}
.u-fakten span{font-size:14.5px;color:var(--ink2)}
.u-inhalt{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,420px);gap:clamp(24px,5vw,80px);padding:20px var(--rand) 60px;align-items:start}
.u-inhalt h2{font-family:var(--serif);font-weight:400;color:var(--or);font-size:clamp(24px,2.4vw,34px);margin:28px 0 8px}
.u-inhalt p{max-width:66ch}
.u-seite{position:sticky;top:calc(var(--kopf) + 20px);display:flex;flex-direction:column;gap:18px}
.u-dia{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:18px;padding:22px}
.u-dia h3{font-size:15px;margin:0 0 4px}
.u-dia .zeile{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:14px;margin:10px 0}
.u-dia .zeile i{height:8px;border-radius:4px;background:rgba(var(--or-rgb),.12);overflow:hidden;position:relative}
.u-dia .zeile i::after{content:"";position:absolute;inset:0;background:var(--or);transform-origin:left;transform:scaleX(0);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.u-dia.an .zeile i::after{transform:scaleX(var(--v))}
.u-dia .zeile em{font-style:normal;font-weight:500;white-space:nowrap}
.u-cta{background:var(--or);color:var(--on-or);border-radius:18px;padding:22px}
.u-cta h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 8px}
.u-cta .knopf{background:var(--on-or);color:var(--or);margin-top:8px}
.u-faq{padding:0 var(--rand) 60px;max-width:900px}
.u-faq details{border-top:1px solid var(--line)}
.u-faq summary{cursor:pointer;min-height:56px;display:flex;align-items:center;font-weight:500;list-style:none;gap:12px}
.u-faq summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--or);transition:transform .3s}
.u-faq details[open] summary::after{transform:rotate(45deg)}
.u-faq details p{margin:0 0 18px;color:var(--ink2)}
.u-weiter{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 var(--rand) 70px}
.u-weiter a{display:flex;flex-direction:column;justify-content:center;min-height:110px;border:1px solid var(--line);border-radius:18px;padding:18px 22px;text-decoration:none;transition:border-color .3s,transform .4s}
.u-weiter a:hover{border-color:var(--or);transform:translateY(-3px)}
.u-weiter span{font-size:13px;color:var(--ink2)}.u-weiter b{font-family:var(--serif);font-weight:400;color:var(--or);font-size:24px}
.u-weiter a:last-child{text-align:right}
/* Materialwahl (Unterseite Verkleidung) */
.mat{padding:30px var(--rand) 50px}
.mat-kopf{max-width:640px;margin-bottom:28px}.mat-kopf p:last-child{color:var(--ink2)}
.mat-reihe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,26px)}
.mat-karte{cursor:pointer;outline-offset:6px;display:flex;flex-direction:column}
.mat-bild{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--bg2);box-shadow:0 30px 50px -40px rgba(var(--or-rgb),.6)}
.mat-bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.mat-ofen{opacity:0;transform:scale(1.06)}
.mat-karte:hover .mat-nah{transform:scale(1.05)}
.mat-karte.am-ofen .mat-ofen,.mat-karte.ohne-nah .mat-ofen{opacity:1;transform:none}
.mat-karte.am-ofen .mat-nah{opacity:0}
.mat-nr{position:absolute;left:14px;top:12px;font:300 34px/1 var(--serif);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.mat-tipp{position:absolute;right:12px;bottom:12px;background:rgba(var(--bg-rgb),.9);color:var(--or);font-size:14px;font-weight:500;border-radius:999px;padding:8px 14px;min-height:36px;display:flex;align-items:center}
.mat-karte.am-ofen .mat-tipp::before{content:"← "}.mat-karte.ohne-nah .mat-tipp{display:none}
.mat-karte h3{font:400 clamp(24px,2vw,30px)/1.1 var(--serif);color:var(--or);margin:16px 0 2px}
.mat-satz{margin:0;font-weight:500}
.mat-text{color:var(--ink2);font-size:15px;margin:8px 0 12px}
.mat-karte dl{margin:0;display:grid;gap:6px;font-size:14px}
.mat-karte dl div{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.mat-karte dt{color:var(--ink2)}.mat-karte dd{margin:0}
.pkt{display:inline-flex;gap:5px}.pkt i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--or);opacity:.35}.pkt i.an{background:var(--or);opacity:1}
.mat-gut{font-size:14px;margin:12px 0 0;color:var(--ink2)}.mat-gut b{color:var(--ink);font-weight:600;margin-right:4px}
@media (max-width:1100px){.mat-reihe{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mat-reihe{grid-template-columns:minmax(0,1fr)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:900px){.u-inhalt{grid-template-columns:1fr}.u-seite{position:static}.u-weiter{grid-template-columns:1fr}.u-weiter a:last-child{text-align:left}.u-held{height:62vh}}
</style>
</head>
<body>
<header class="u-kopf"><a class="logo" href="index.html" data-firma>FEUERRAUM</a><a class="zurueck" id="zurueck" href="index.html">← Zurück zur Stelle</a></header>
<main id="u"></main>
<footer class="fuss">
  <div><b data-firma>FEUERRAUM</b><p>Kaminöfen · Kachelöfen · Ofenbau</p></div>
  <div><p>Ausstellung: Di–Fr 10–18 Uhr, Sa 10–14 Uhr</p></div>
  <nav aria-label="Rechtliches"><a href="schicht.html?s=impressum">Impressum</a><a href="schicht.html?s=datenschutz">Datenschutz</a></nav>
  <p class="demo">Demo-Webseite eines Musterbetriebs. Formulare senden nichts. Werte zur allgemeinen Orientierung, maßgeblich sind Herstellerangaben und der Schornsteinfeger.</p>
</footer>
<script src="assets/js/schichten.js?v=1"></script>
</body>
</html>
