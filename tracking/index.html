<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' ; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Projekt-Tracking · PROJEKT EX</title>
<link rel="stylesheet" href="../assets/tracking.css">
<link rel="stylesheet" href="tracking.css">
</head>
<body class="tp">
<main class="trk tp-main" aria-labelledby="tp-h">
  <div class="trk-glow" aria-hidden="true"></div>
  <div class="trk-in tp-in">
    <a class="tp-logo" href="../">PROJEKT EX</a>
    <div class="trk-glass trk-page tp-card" id="tp-card" aria-live="polite">
      <div class="trk-top"><div><small id="tp-nr">Projekt wird geladen …</small><b id="tp-h">Projekt-Tracking</b></div><span class="trk-ex" id="tp-typ" hidden></span></div>
      <div class="trk-pct"><b id="tp-pct">0 %</b><span>Aktuell: <strong id="tp-now">–</strong></span></div>
      <div class="trk-track"><div class="trk-fill" id="tp-fill" style="--p:0"></div></div>
      <ol class="trk-steps tp-steps" id="tp-steps"></ol>
      <p class="tp-upd" id="tp-upd"></p>
    </div>
    <div class="trk-glass tp-err" id="tp-err" hidden>
      <h1>Link nicht gefunden.</h1>
      <p>Bitte prüfen Sie den Link aus Ihrer E-Mail. Bei Fragen erreichen Sie uns unter <a href="mailto:kontakt@projektex.de">kontakt@projektex.de</a>.</p>
    </div>
    <p class="tp-foot">Fragen zum Projekt? <a href="mailto:kontakt@projektex.de">kontakt@projektex.de</a> · <a href="../impressum.html">Impressum</a> · <a href="../datenschutz.html">Datenschutz</a></p>
  </div>
</main>
<script src="tracking.js" defer></script>
</body>
</html>
